<style>
:root{--gold:#fdc16d;--gold2:#a9772a;--emer:#2bd08a;--emerd:#0f7d57;--ink:#eaf3ee;--mut:#8fb0a2;--mut2:#5f7d70;--glass:rgba(255,255,255,.05);--stroke:rgba(253,193,109,.16);--bad:#ff8f8f}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Heebo',sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;background:radial-gradient(120% 60% at 80% -5%,rgba(43,208,138,.12),transparent 45%),radial-gradient(100% 50% at 10% 20%,rgba(253,193,109,.08),transparent 40%),linear-gradient(170deg,#03150d,#02110b 50%,#010b07);min-height:100vh}
.jak{font-family:'Plus Jakarta Sans',sans-serif}.serif{font-family:'Frank Ruhl Libre',serif}
.app{max-width:460px;margin:0 auto;padding-bottom:92px}
.bnav{position:fixed;bottom:0;left:0;right:0;max-width:460px;margin:0 auto;background:rgba(2,17,11,.93);backdrop-filter:blur(16px);border-top:1px solid var(--stroke);display:flex;z-index:50}
.bnav button{flex:1;background:none;border:none;color:var(--mut);font-family:'Plus Jakarta Sans';font-weight:600;font-size:10.5px;padding:9px 2px 11px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
.bnav button .i{font-size:20px;line-height:1}
.bnav button.on{color:var(--gold)}
.bnav button.on .i{transform:translateY(-1px)}
.chip.on{background:var(--gold);color:#2a1c06;border-color:var(--gold);font-weight:700}
.catbar{display:flex;justify-content:space-between;align-items:center;background:rgba(255,255,255,.05);border:1px solid var(--stroke);border-radius:12px;padding:13px 15px;margin-bottom:8px;cursor:pointer;font-weight:600;font-size:14.5px}
.ftabs{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;-webkit-overflow-scrolling:touch}

.toggle{width:46px;height:26px;border-radius:99px;background:rgba(255,255,255,.12);position:relative;cursor:pointer;transition:.2s;flex-shrink:0}

/* ============================================================
   GUEST EXPERIENCE — editorial warm-luxe redesign (scoped)
   ============================================================ */
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..600&family=Assistant:wght@300;400;500;600;700&display=swap');

body.gmode{background:#F6F2EA;color:#2A2A24}
body.gmode #screen{max-width:640px;margin:0 auto;padding:0 0 60px}
body.gmode .serif{font-family:'Fraunces',serif;font-weight:400;letter-spacing:0}

/* hide the old hero bits we replace */
body.gmode .topbar{display:none!important}
body.gmode #screen{padding-top:0}
body.gmode .ghero,body.gmode .gbanner{display:none}

/* --- cinematic hero --- */
body.gmode .ghero-new{position:relative;height:74vh;min-height:520px;margin-bottom:26px;overflow:hidden;display:flex;align-items:flex-end}
body.gmode .ghero-new .bg{position:absolute;inset:0}
body.gmode .ghero-new .bg img{width:100%;height:100%;object-fit:cover;animation:gzoom 18s ease-in-out infinite alternate}
@keyframes gzoom{from{transform:scale(1.02)}to{transform:scale(1.12)}}
body.gmode .ghero-new .bg::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(30,32,24,.34) 0%,rgba(30,32,24,.05) 40%,rgba(30,32,24,.6) 100%)}
body.gmode .ghero-new .in{position:relative;z-index:2;padding:0 28px 40px;color:#fff;width:100%}
body.gmode .ghero-new .logo{width:64px;height:64px;border-radius:16px;object-fit:contain;background:rgba(255,255,255,.1);backdrop-filter:blur(8px);padding:8px;border:1px solid rgba(255,255,255,.25);margin-bottom:18px}
body.gmode .ghero-new .eyebrow{font-size:11px;letter-spacing:.4em;text-transform:uppercase;opacity:.85;margin-bottom:10px}
body.gmode .ghero-new h1{font-family:'Fraunces',serif;font-weight:300;font-size:clamp(40px,12vw,64px);line-height:.98;letter-spacing:.01em}
body.gmode .ghero-new .welcome{font-family:'Fraunces',serif;font-style:italic;font-size:18px;margin-top:14px;opacity:.94}

/* --- quick-nav pills --- */
body.gmode .gnav{display:flex;gap:8px;overflow-x:auto;padding:0 20px 20px;scrollbar-width:none}
body.gmode .gnav::-webkit-scrollbar{display:none}
body.gmode .gnav .chip{flex:0 0 auto;background:#fff;border:1px solid #E4DDCF;color:#5A5A4E;padding:10px 16px;border-radius:100px;font-size:13px;font-weight:500;box-shadow:0 2px 10px rgba(120,110,90,.06);transition:.3s}
body.gmode .gnav .chip:active{transform:scale(.96)}

/* --- content wrap --- */
body.gmode .gwrap{padding:0 20px}

/* section headers */
body.gmode .sec{display:flex;align-items:center;gap:10px;margin:34px 4px 16px}
body.gmode .sec .b{width:22px;height:1.5px;background:#A9865C;flex:0 0 auto}
body.gmode .sec h2{font-family:'Fraunces',serif;font-weight:400;font-size:22px;color:#2A2A24;letter-spacing:0}

/* cards / panels */
body.gmode .panel{background:#fff;border:1px solid #EAE3D6;border-radius:20px;padding:20px;margin-bottom:14px;box-shadow:0 6px 26px rgba(120,105,75,.06)}
body.gmode .line{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid #F0EBE0}
body.gmode .line:last-child{border-bottom:none}
body.gmode .lbl{color:#8A8574;font-size:13.5px;font-weight:400}
body.gmode .jak,body.gmode .v{font-family:'Assistant';color:#2A2A24}
body.gmode .k{color:#8A8574;font-size:12px}

/* key-value tiles (wifi / checkin) */
body.gmode .kv{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:6px}
body.gmode .kvc{background:#fff;border:1px solid #EAE3D6;border-radius:18px;padding:18px;text-align:center;box-shadow:0 6px 22px rgba(120,105,75,.05)}
body.gmode .kvc .k{font-size:11px;letter-spacing:.08em;margin-bottom:7px}
body.gmode .kvc .v{font-size:19px;font-weight:600;color:#3A4030;word-break:break-word}

/* buttons */
body.gmode .btn{border-radius:100px;font-weight:600;letter-spacing:.02em;padding:15px;font-size:14.5px;transition:.3s}
body.gmode .btn.wa{background:#3A4030;color:#F6F2EA}
body.gmode .btn.wa:active{transform:scale(.98)}
body.gmode .btn.em{background:#A9865C;color:#fff}
body.gmode .btn.ghost{background:transparent;border:1px solid #D8CFBE;color:#5A5A4E}
body.gmode .chip{border-radius:100px}

/* amenity chips row (old) hidden — replaced by .gnav */
body.gmode .amen{display:none}

/* notes / small print */
body.gmode .note{background:#F0EBE0;border-radius:12px;padding:12px 14px;font-size:13px;color:#6A6555;border:none}

/* payment emphasis boxes keep their inline styles but soften on light bg */
body.gmode .panel .lbl{font-size:13.5px}

/* inputs */
body.gmode .inp{background:#FAF8F2;border:1px solid #E4DDCF;border-radius:12px;color:#2A2A24;padding:13px 14px;font-family:'Assistant'}
body.gmode .inp::placeholder{color:#B3AC9A}

/* signature pad */
body.gmode .sig{background:#fff;border:1px dashed #C9BFA9;border-radius:14px}

/* reviews form stars */
body.gmode #g-reviews+*{}

/* footer tab bar inside guest (ftabs) */
body.gmode .ftabs{background:#fff;border-top:1px solid #EAE3D6}

/* elegant divider between sections */
body.gmode .gdiv{height:1px;background:linear-gradient(90deg,transparent,#E0D8C8,transparent);margin:30px 24px}

/* reveal */
body.gmode .grv{opacity:0;transform:translateY(20px);transition:opacity .9s cubic-bezier(.22,.61,.36,1),transform .9s cubic-bezier(.22,.61,.36,1)}
body.gmode .grv.in{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){body.gmode .grv{opacity:1;transform:none}body.gmode .ghero-new .bg img{animation:none}}


/* ===== systematic owner dashboard ===== */
.dashhead{background:linear-gradient(135deg,rgba(43,208,138,.10),rgba(253,193,109,.06));border:1px solid var(--stroke);border-radius:18px;padding:20px;margin-bottom:14px}
.dashhead .dh-k{font-size:12.5px;color:var(--mut);letter-spacing:.02em}
.dashhead .dh-v{font-family:'Frank Ruhl Libre',serif;font-size:34px;font-weight:800;color:var(--ivory,#EAF2EC);margin:4px 0 12px;letter-spacing:.5px}
.dashhead .dh-bar{height:7px;border-radius:100px;background:rgba(255,255,255,.08);overflow:hidden}
.dashhead .dh-fill{height:100%;border-radius:100px;background:linear-gradient(90deg,var(--emer),#7fe0b0);transition:width .8s cubic-bezier(.22,.61,.36,1)}
.dashhead .dh-sub{display:flex;justify-content:space-between;margin-top:9px;font-size:12.5px;color:var(--mut)}

.kpigrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px;margin-bottom:6px}
.kpigrid .kcard{background:var(--card,rgba(255,255,255,.03));border:1px solid var(--stroke);border-radius:14px;padding:13px 11px;text-align:center;transition:.25s}
.kpigrid .kcard.clk{cursor:pointer}
.kpigrid .kcard.clk:active{transform:scale(.97)}
.kpigrid .kl{font-size:10.5px;color:var(--mut);letter-spacing:.02em;margin-bottom:6px;white-space:nowrap}
.kpigrid .kv{font-family:'Frank Ruhl Libre',serif;font-size:19px;font-weight:800;color:var(--ivory,#EAF2EC);line-height:1}
.kpigrid .kv.gold{color:var(--gold)}.kpigrid .kv.em{color:var(--emer)}.kpigrid .kv.bad{color:var(--bad)}
.kpigrid .ks{font-size:10px;color:var(--mut2,rgba(255,255,255,.4));margin-top:5px}
@media(max-width:360px){.kpigrid .kv{font-size:17px}.kpigrid .kl{font-size:10px}}


/* ===== systematic bookings list ===== */
.bstats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px;margin:10px 0 8px}
.bstats .bstat{background:var(--card,rgba(255,255,255,.03));border:1px solid var(--stroke);border-radius:13px;padding:11px;text-align:center}
.bstats .bn{font-family:'Frank Ruhl Libre',serif;font-size:22px;font-weight:800;color:var(--ivory,#EAF2EC);line-height:1}
.bstats .bt{font-size:10.5px;color:var(--mut);margin-top:4px}
.bfilter{display:flex;gap:7px;margin:4px 0 10px}
.bfilter .chip{flex:1;text-align:center}

.bcard.sys{position:relative;overflow:hidden;padding-inline-start:16px}
.bcard.sys::before{content:'';position:absolute;inset-inline-start:0;top:0;bottom:0;width:4px;background:var(--stripe)}
.bcard.sys .bcard-badges{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
.bcard.sys .bpay{margin-top:9px}
.bcard.sys .bpay-bar{height:5px;border-radius:100px;background:rgba(255,255,255,.08);overflow:hidden}
.bcard.sys .bpay-fill{height:100%;border-radius:100px;transition:width .6s cubic-bezier(.22,.61,.36,1)}
.bcard.sys .bpay-txt{font-size:12px;color:var(--mut);margin-top:5px}


/* ===== systematic "more" menu ===== */
.msec{display:flex;align-items:center;gap:9px;font-size:12.5px;letter-spacing:.02em;color:var(--gold);margin:22px 4px 10px;font-weight:600}
.msec-b{width:18px;height:1.5px;background:var(--gold);flex:0 0 auto}
.mgroup{background:var(--card,rgba(255,255,255,.03));border:1px solid var(--stroke);border-radius:16px;overflow:hidden}
.mtile{display:flex;align-items:center;gap:12px;padding:14px 15px;border-bottom:1px solid var(--stroke);cursor:pointer;transition:background .2s}
.mtile:last-child{border-bottom:none}
.mtile:active{background:rgba(255,255,255,.04)}
.mtile .mt-ic{width:40px;height:40px;border-radius:11px;background:rgba(255,255,255,.05);display:flex;align-items:center;justify-content:center;font-size:19px;flex:0 0 auto}
.mtile .mt-body{flex:1;min-width:0}
.mtile .mt-nm{font-weight:600;font-size:14.5px;color:var(--ivory,#EAF2EC)}
.mtile .mt-mt{font-size:11.5px;color:var(--mut);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mtile .mt-arr{color:var(--mut);font-size:20px}


/* owner-preview back bar (only when owner previews guest view) */
.ownerpv{position:sticky;top:0;z-index:60;display:flex;align-items:center;justify-content:space-between;gap:10px;background:#3A4030;color:#F6F2EA;padding:11px 16px;font-size:13px;cursor:pointer;box-shadow:0 3px 14px rgba(0,0,0,.25)}
.ownerpv-back{background:rgba(255,255,255,.16);border-radius:100px;padding:6px 14px;font-weight:600;white-space:nowrap}
</style>

/* ---- Hebrew calendar: computed, so it stays correct every year ---- */
function hLeap(y){return ((y*7+1)%19)<7;}
function hMonths(y){return hLeap(y)?13:12;}
function hDelay1(y){const mo=Math.floor((235*y-234)/19),pa=12084+13753*mo;
  let day=mo*29+Math.floor(pa/25920); if(((3*(day+1))%7)<3)day++; return day;}
function hDelay2(y){const l=hDelay1(y-1),p=hDelay1(y),n=hDelay1(y+1);
  if(n-p===356)return 2; if(p-l===382)return 1; return 0;}
function hElapsed(y){return hDelay1(y)+hDelay2(y);}
function hYearDays(y){return hElapsed(y+1)-hElapsed(y);}
function hMonthDays(y,m){
  if(m===2||m===4||m===6||m===10||m===13)return 29;
  if(m===12&&!hLeap(y))return 29;
  if(m===8&&hYearDays(y)%10!==5)return 29;
  if(m===9&&hYearDays(y)%10===3)return 29;
  return 30;}
function hToAbs(y,m,d){let a=d+hElapsed(y)-1373428;
  if(m<7){for(let mm=7;mm<=hMonths(y);mm++)a+=hMonthDays(y,mm);
          for(let mm=1;mm<m;mm++)a+=hMonthDays(y,mm);}
  else{for(let mm=7;mm<m;mm++)a+=hMonthDays(y,mm);}
  return a;}
function absISO(a){const d=new Date((a-719163)*86400000),p=n=>(n<10?'0':'')+n;
  return d.getUTCFullYear()+'-'+p(d.getUTCMonth()+1)+'-'+p(d.getUTCDate());}
function dateToAbs(dt){return Math.floor(Date.UTC(dt.getFullYear(),dt.getMonth(),dt.getDate())/86400000)+719163;}
function absToHeb(a){let y=Math.floor((a+1373428)/366);
  while(hToAbs(y+1,7,1)<=a)y++;
  let m=(a<hToAbs(y,1,1))?7:1;
  while(a>hToAbs(y,m,hMonthDays(y,m)))m++;
  return {y:y,m:m,d:a-hToAbs(y,m,1)+1};}
const G1=['','א','ב','ג','ד','ה','ו','ז','ח','ט'],
      G10=['','י','כ','ל','מ','נ','ס','ע','פ','צ'],
      G100=['','ק','ר','ש','ת','תק','תר','תש','תת','תתק'];
function gem(n){let s=G100[Math.floor(n/100)]+''; n%=100;
  if(n===15)s+='טו'; else if(n===16)s+='טז';
  else s+=G10[Math.floor(n/10)]+G1[n%10];
  if(s.length===1)return s+'׳';
  return s.slice(0,-1)+'״'+s.slice(-1);}
const HMN=['','ניסן','אייר','סיון','תמוז','אב','אלול','תשרי','חשון','כסלו','טבת','שבט','אדר','אדר ב׳'];
function hMonthName(y,m){return (m===12&&hLeap(y))?'אדר א׳':HMN[m];}
function hebDay(dt){const h=absToHeb(dateToAbs(dt));return gem(h.d);}
function hebFull(dt){const h=absToHeb(dateToAbs(dt));
  return gem(h.d)+' '+hMonthName(h.y,h.m)+' '+gem(h.y%1000);}

const pad2=n=>(n<10?'0':'')+n;

function todayISO(){const d=new Date();return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());}
function isNowIn(b){const t=todayISO();if(b.type==='day')return b.cin===t;return b.cin&&b.cout&&b.cin<=t&&t<b.cout;}

function fillMsg(t,b){const bal=b.total-b.paid;const link=location.origin+location.pathname+'?guest='+b.id;const rlink=link+'#review';return (t||'').replace(/\\+n/g,'\n').replace(/\{\{לינקחוותדעת\}\}/g,rlink).replace(/\{\{שם\}\}/g,b.guest).replace(/\{\{וילה\}\}/g,S.villa.name).replace(/\{\{תאריכים\}\}/g,isoDM(b.cin)+(b.type==='day'?'':' – '+isoDM(b.cout))).replace(/\{\{כניסה\}\}/g,isoDM(b.cin)+' '+(b.ciTime||S.villa.ci)).replace(/\{\{יציאה\}\}/g,isoDM(b.cout)+' '+(b.coTime||S.villa.co)).replace(/\{\{אורחים\}\}/g,b.guests).replace(/\{\{זוגות\}\}/g,(b.couples!=null?b.couples:0)).replace(/\{\{טלפון\}\}/g,b.phone||'').replace(/\{\{כתובת\}\}/g,S.villa.addr).replace(/\{\{סהכ\}\}/g,money(b.total)).replace(/\{\{יתרה\}\}/g,money(bal)).replace(/\{\{פיקדון\}\}/g,money(S.villa.deposit)).replace(/\{\{וויפי\}\}/g,S.villa.wifi+' / '+S.villa.wifiPass).replace(/\{\{לינק\}\}/g,link).replace(/\{\{ניווט\}\}/g,S.villa.waze||'');}
function fillContract(t,b){return (t||'').replace(/\{\{שם\}\}/g,b.guest).replace(/\{\{תאריכים\}\}/g,isoDM(b.cin)+(b.type==='day'?'':' – '+isoDM(b.cout))).replace(/\{\{אורחים\}\}/g,b.guests).replace(/\{\{פיקדון\}\}/g,money(S.villa.deposit)).replace(/\{\{וילה\}\}/g,S.villa.name).replace(/\{\{כתובת\}\}/g,S.villa.addr);}

function metrics(){

function initSig(){const c=document.getElementById('sig');if(!c)return;c.width=c.clientWidth;c.height=150;const ctx=c.getContext('2d');ctx.fillStyle='#ffffff';ctx.fillRect(0,0,c.width,c.height);ctx.strokeStyle='#013426';ctx.lineWidth=2.8;ctx.lineCap='round';ctx.lineJoin='round';let drawing=false;
  const pos=e=>{const r=c.getBoundingClientRect();const t=e.touches?e.touches[0]:e;return[t.clientX-r.left,t.clientY-r.top];};
  const start=e=>{drawing=true;const[x,y]=pos(e);ctx.beginPath();ctx.moveTo(x,y);e.preventDefault();};
  const move=e=>{if(!drawing)return;const[x,y]=pos(e);ctx.lineTo(x,y);ctx.stroke();S.tmpInk=true;e.preventDefault();};
  const end=()=>{drawing=false;};
  c.addEventListener('mousedown',start);c.addEventListener('mousemove',move);window.addEventListener('mouseup',end);
  c.addEventListener('touchstart',start,{passive:false});c.addEventListener('touchmove',move,{passive:false});c.addEventListener('touchend',end);
}

function monthlySummary(){const m={};S.bookings.forEach(b=>{if(!b.cin)return;const k=b.cin.slice(0,7);if(!m[k])m[k]={rev:0,nights:0,cnt:0};m[k].rev+=b.total;m[k].nights+=(b.nights||0);m[k].cnt++;});return Object.entries(m).sort((a,b)=>b[0].localeCompare(a[0]));}
function dlCSV(name,rows){const csv='\uFEFF'+rows.map(r=>r.map(c=>{c=(c==null?'':String(c));return /[",\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c;}).join(',')).join('\n');const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1500);toast('הקובץ ירד ✓');}

  const L=['*📊 סיכום כספי · '+S.villa.name+'*','_'+isoDM(todayISO())+'_','','━━━━━━━━━━','*💰 כספים*','הכנסות מהזמנות: *'+money(rev)+'*','נגבה בפועל: '+money(paid),'יתרות פתוחות: '+money(rev-paid),'מכירות חנות: '+money(shop),'הוצאות: '+money(exp),'*📈 רווח נטו: '+money(rev+shop-exp)+'*','','📅 '+S.bookings.length+' הזמנות · 🌙 '+nights+' לילות',''];
  if(ms.length){L.push('━━━━━━━━━━','*📊 לפי חודשים*');ms.forEach(([k,v])=>L.push('• '+monthName(k)+' — '+money(v.rev)+' ('+v.cnt+' הזמנות)'));L.push('');}
  const bs=S.bookings.slice().sort((a,b)=>(b.cin||'').localeCompare(a.cin||''));
  if(bs.length){
    L.push('━━━━━━━━━━','*👥 פירוט לקוחות*','');
    bs.forEach(b=>{
      const bal=b.total-b.paid;
      L.push('*'+b.guest+'*'+(b.phone?' · '+b.phone:''));
      L.push('🗓️ '+isoDM(b.cin)+(b.type==='day'?' (יום כיף)':' – '+isoDM(b.cout))+' · 👥 '+b.guests+' אורחים');
      L.push('💰 סה״כ '+money(b.total)+' · ✓ נגבה '+money(b.paid));
      L.push(bal>0?'⏳ *יתרה לגבייה: '+money(bal)+'*':'✅ שולם במלואו');
      L.push((b.signed?'✍️ חוזה חתום':'⚠️ ללא חתימה')+(b.payMethod?' · '+b.payMethod:''));
      L.push('');
    });
  }
  const owed=S.bookings.filter(b=>b.total-b.paid>0);
  if(owed.length){
    L.push('━━━━━━━━━━','*⏳ יתרות לגבייה ('+owed.length+')*');

    L.push('','*סה״כ לגבייה: '+money(owed.reduce((a,b)=>a+(b.total-b.paid),0))+'*','');
  }

};

function compressImg(file,maxW,q){return new Promise((res,rej)=>{const img=new Image();const rd=new FileReader();rd.onload=()=>{img.onload=()=>{let w=img.width,h=img.height;if(w>maxW){h=Math.round(h*maxW/w);w=maxW;}const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);res(c.toDataURL('image/jpeg',q));};img.onerror=rej;img.src=rd.result;};rd.onerror=rej;rd.readAsDataURL(file);});}

A.printContract=function(id){const b=S.bookings.find(x=>x.id===id)||cur();const v=S.villa;const w=window.open('','_blank');if(!w){alert('לא ניתן לפתוח חלון. אפשרו חלונות קופצים.');return;}const terms=fillContract(v.contract,b).replace(/</g,'&lt;').replace(/\n/g,'<br>');const dt=b.type==='day'?isoDM(b.cin):isoDM(b.cin)+' – '+isoDM(b.cout);const nights=b.type==='day'?'יום כיף':nightsOf(b.cin,b.cout)+' לילות';const bal=b.total-b.paid;const pay=b.payMethod||'בהגעה';const balRow=bal>0?'<div class="r"><span>⏳ נותר לתשלום</span><b style="color:#b8860b">'+money(bal)+'</b></div>':'<div class="r"><span>✓ סטטוס</span><b style="color:#0a7d4f">שולם במלואו</b></div>';const html='<html dir="rtl" lang="he"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>סיכום הזמנה - '+b.guest+'</title><style>body{font-family:Arial,Helvetica,sans-serif;padding:26px;color:#111;line-height:1.7;max-width:640px;margin:auto}h1{font-size:22px;text-align:center;margin:0 0 4px}.sub{text-align:center;color:#777;font-size:13px;margin-bottom:18px}.box{border:1px solid #ddd;border-radius:10px;padding:14px 16px;margin:12px 0}.box h2{font-size:14px;margin:0 0 8px;color:#0a5c43;border-bottom:1px solid #eee;padding-bottom:6px}.r{display:flex;justify-content:space-between;padding:3px 0;font-size:14px}.r b{color:#000}img{max-width:260px;border:1px solid #ccc;border-radius:8px;background:#fff}small{color:#888}.terms{font-size:13px;color:#333}.bar{position:fixed;bottom:0;left:0;right:0;display:flex;gap:10px;padding:14px;background:#fff;border-top:1px solid #eee;box-shadow:0 -4px 14px rgba(0,0,0,.08)}.bar button{flex:1;padding:14px;border:none;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer}.pdf{background:#0a5c43;color:#fff}.cls{background:#eee;color:#333}@media print{.bar{display:none}}body{padding-bottom:96px}</style></head><body><h1>סיכום הזמנה</h1><div class="sub">'+v.name+' · '+v.addr+'</div><div class="box"><h2>פרטי האירוח</h2><div class="r"><span>👤 שוכר</span><b>'+b.guest+'</b></div><div class="r"><span>📞 טלפון</span><b>'+b.phone+'</b></div><div class="r"><span>🪪 ת\"ז</span><b>'+(b.idNumber||'—')+'</b></div><div class="r"><span>🗓️ תאריכים</span><b>'+dt+'</b></div><div class="r"><span>🌙 משך</span><b>'+nights+'</b></div><div class="r"><span>👥 אורחים</span><b>'+b.guests+'</b></div></div><div class="box"><h2>תשלום</h2><div class="r"><span>💰 מחיר כולל</span><b>'+money(b.total)+'</b></div><div class="r"><span>✓ שולמה מקדמה</span><b style="color:#0a7d4f">'+money(b.paid)+'</b></div><div class="r"><span>💳 אמצעי תשלום</span><b>'+pay+'</b></div>'+balRow+'<div class="r"><span>💵 פיקדון ביטחון</span><b>'+money(v.deposit)+'</b></div></div><div class="box"><h2>תנאי ההסכם</h2><div class="terms">'+terms+'</div></div><div class="box"><h2>חתימת השוכר</h2>'+(b.signature?'<img src="'+b.signature+'">':'—')+'<br><small>נחתם דיגיטלית · אישור פיקדון · '+v.name+'</small></div><div class="bar"><button class="cls" onclick="window.close()">סגור</button><button class="pdf" onclick="window.print()">📄 ייצוא ל-PDF</button></div></body></html>';w.document.write(html);w.document.close();};
function reviewMsgFor(b){let m=fillMsg(S.villa.msgReview,b);const dates=isoDM(b.cin)+(b.type==='day'?'':' – '+isoDM(b.cout));if(m.indexOf(dates)===-1){const stay='תודה שהתארחתם אצלנו ב'+S.villa.name+' ('+dates+')!';const nl=m.indexOf('\n');m=(nl>=0)?(m.slice(0,nl+1)+stay+'\n'+m.slice(nl+1)):(stay+'\n'+m);}return m.replace(/(\?guest=[A-Za-z0-9\-]+)(?![A-Za-z0-9\-])/g,function(full,id,off,str){return str.slice(off+full.length).indexOf('#review')===0?full:full+'#review';});}
A.reviewLink=function(b){const ph=waNum(b.phone);const msg=reviewMsgFor(b);return ph?('https://wa.me/'+ph+'?text='+encodeURIComponent(msg)):('https://wa.me/?text='+encodeURIComponent(msg));};
A.markReviewAsked=function(id){const b=S.bookings.find(x=>x.id===id);if(b&&!b.reviewAsked){persist(()=>SB.from('bookings').update({review_asked:true}).eq('id',id));}};
A.waSummaryLink=function(b){const v=S.villa;const dt=b.type==='day'?isoDM(b.cin):isoDM(b.cin)+' – '+isoDM(b.cout);const nights=b.type==='day'?'יום כיף':nightsOf(b.cin,b.cout)+' לילות';const bal=b.total-b.paid;const pay=b.payMethod||'בהגעה';const L=['📋 סיכום הזמנה · '+v.name,'👤 '+b.guest,'🗓️ '+dt+' · '+nights,'👥 '+b.guests+' אורחים','━━━━━━━','💰 מחיר כולל: '+money(b.total),(b.advancePaid?'✓ שולמה מקדמה: ':'🔸 מקדמה מוסכמת: ')+money(b.paid)+' ('+pay+')',(bal>0?'⏳ נותר לתשלום: '+money(bal)+((b.balMethod||b.payMethod)?' ('+(b.balMethod||b.payMethod)+')':''):'✓ שולם במלואו'),'💵 פיקדון ביטחון: '+money(v.deposit),'━━━━━━━','✍️ החוזה נחתם דיגיטלית · הפיקדון אושר','📍 '+v.addr];const adv=b.paid||0;const advTpl=payTemplateFor(b.payMethod);if(adv>0&&advTpl&&!b.advancePaid){const at=fillMsg(advTpl.replace(/\{\{יתרה\}\}/g,'{{מקדמה}}'),b).replace(/\{\{מקדמה\}\}/g,money(adv));L.push('━━━━━━━');L.push('💳 להעברת המקדמה ('+money(adv)+'):');L.push(at);}const bd=(bal>0?balDetailsFor(b):'');if(bd){L.push('━━━━━━━');L.push('💳 לתשלום היתרה ('+money(bal)+'):');L.push(bd);}const n=waNum(b.phone);return 'https://wa.me/'+n+'?text='+encodeURIComponent(L.join('\n'));};

A.delB=function(id){const b=S.bookings.find(x=>x.id===id);if(!confirm("למחוק את ההזמנה של "+(b?b.guest:"")+"? פעולה זו אינה ניתנת לביטול."))return;S.view="bookings";persist(async()=>{await SB.from("orders").delete().eq("booking_id",id);return await SB.from("bookings").delete().eq("id",id);},"ההזמנה נמחקה");};

A.calNav=function(d){let M=S.calM+d,Y=S.calY;if(M<0){M=11;Y--;}if(M>11){M=0;Y++;}S.calM=M;S.calY=Y;render();};
A.orderSet=function(id,status){persist(()=>SB.from('orders').update({status}).eq('id',id),'הזמנת החנות עודכנה ✓');};
A.editB=function(id){S.editBid=id;S.view='bedit';render();};
A.bookFilter=function(v){S.bookSearch=v;render();const el=document.getElementById('book-search');if(el){el.focus();try{el.setSelectionRange(el.value.length,el.value.length);}catch(e){}}};
A.bookMode=function(m){S.bookFilterMode=m;render();};
A.quickDates=function(id){const b=S.bookings.find(x=>x.id===id);if(!b)return;const ci=document.getElementById('bd-cin'),co=document.getElementById('bd-cout');const day=b.type==='day';const cin=ci?ci.value:b.cin;const cout=day?cin:(co?co.value:b.cout);if(!cin){return;}if(!day&&cout&&cout<=cin){alert('תאריך היציאה חייב להיות אחרי הכניסה');render();return;}const ov=overlapsExisting(cin,cout,day?'day':'overnight',id);if(ov&&!confirm('⚠️ התאריכים חופפים להזמנה של '+ov.guest+'.\nלשמור בכל זאת?')){render();return;}persist(()=>SB.from('bookings').update({cin,cout,nights:day?0:nightsOf(cin,cout)}).eq('id',id),'התאריכים עודכנו ✓');};
A.saveEdit=function(id){const g=x=>document.getElementById(x);const b=S.bookings.find(x=>x.id===id);const day=b.type==='day';const cin=g('e-cin').value;const cout=day?cin:(g('e-cout')?g('e-cout').value:cin);const paid=+g('e-paid').value||0,total=+g('e-total').value||0;const status=paid>=total&&total>0?'paid':paid>0?'partial':'pending';S.view='bdetail';S.curId=id;persist(()=>SB.from('bookings').update({guest:g('e-guest').value,phone:g('e-phone').value,phone2:(g('e-phone2')?g('e-phone2').value:''),cin,cout,nights:day?0:nightsOf(cin,cout),guests:+g('e-guests').value||1,couples:+g('e-couples').value||0,total,paid,pay_method:(g('e-paymethod')?g('e-paymethod').value:''),bal_method:(g('e-balmethod')?g('e-balmethod').value:''),advance_paid:(g('e-advpaid')?g('e-advpaid').checked:false),status,notes:g('e-notes').value,ci_time:(g('e-ci-time')?g('e-ci-time').value:''),co_time:(g('e-co-time')?g('e-co-time').value:'')}).eq('id',id),'ההזמנה עודכנה ✓');};
A.guestLink=function(id){const url=location.origin+location.pathname+'?guest='+id;if(navigator.clipboard){navigator.clipboard.writeText(url);}prompt('הלינק האישי של האורח (העתק ושלח בוואטסאפ):',url);};

/* boot */
async function boot(){
  document.getElementById('screen').innerHTML='<div style="text-align:center;padding:60px;color:var(--mut)">טוען נתונים מהענן… ⏳</div>';
  try{
    const gp=new URLSearchParams(location.search).get('guest');
    if(gp){ S.guestLocked=true; S.app='guest'; await loadGuest(gp); S.curId=(S.bookings.find(b=>b.id===gp)?gp:'__none__'); }
    else{ try{ const {data:{session}}=await SB.auth.getSession(); if(session&&session.user){ S.ownerUnlocked=true; S.ownerEmail=session.user.email||''; } }catch(e){} await loadAll(); }
    render();
    if(location.hash==='#review'){setTimeout(()=>{const el=document.getElementById('g-reviews');if(el)el.scrollIntoView({behavior:'smooth',block:'start'});},450);} }
  catch(e){ document.getElementById('screen').innerHTML='<div style="padding:24px;color:var(--mut);line-height:1.7">לא הצלחתי להתחבר למסד הנתונים.<br>ודא שהרצת את קוד ה-SQL ב-Supabase, ואז רענן.<br><br><span style="color:var(--bad);font-size:12px">'+(e.message||e)+'</span></div>'; }
}

// ---- auto-sync: quietly refresh owner view so signatures/orders update without leaving the screen ----
let _lastSig='', _polling=false;
function dataSig(){try{return JSON.stringify([S.bookings.map(b=>[b.id,b.signed,b.paid,b.status,b.inhouse]),S.orders.map(o=>[o.id,o.status]),S.reviews.length,S.gallery.length,S.products.length]);}catch(e){return '';}}
async function pollSync(){
  if(_polling)return;
  if(S.guestLocked)return;                       // guest page — no need
  if(document.hidden)return;                      // app in background — save data
  if(['newb','pedit','settings','shopcats','gallery','contract','checklist','contracts'].includes(S.view))return; // don't interrupt editing
  const ae=document.activeElement;
  if(ae&&(ae.tagName==='INPUT'||ae.tagName==='TEXTAREA'||ae.tagName==='SELECT'))return; // user is typing
  _polling=true;
  try{await loadAll();const sig=dataSig();if(sig!==_lastSig){_lastSig=sig;render();}}catch(e){}
  _polling=false;
}
setInterval(pollSync,15000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)pollSync();}); // refresh instantly when returning to the app
boot();
</script>
